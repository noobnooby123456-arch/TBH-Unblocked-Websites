<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #0f172a;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .digit-box {
      font-family: 'Courier New', Courier, monospace;
      background: #020617;
      color: #ef4444;
      font-size: 22px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      min-width: 55px;
      text-align: center;
      border: 1px solid #1e293b;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 12px;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .grid {
      display: grid;
      gap: 2px;
      background: #0f172a;
      padding: 4px;
      border-radius: 6px;
      border: 2px solid #334155;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #dc2626 !important; }
    .cell-1 { color: #38bdf8; }
    .cell-2 { color: #4ade80; }
    .cell-3 { color: #f87171; }
    .cell-4 { color: #818cf8; }
    .cell-5 { color: #fb923c; }
    .cell-6 { color: #2dd4bf; }
    .cell-7 { color: #e879f9; }
    .cell-8 { color: #cbd5e1; }
    .tools {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: space-between;
    }
    .toggle-btn {
      flex: 1;
      padding: 6px 12px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-bar">
      <div class="digit-box" id="mineCounter">010</div>
      <button class="face-btn" id="faceBtn" onclick="initGame()">🙂</button>
      <div class="digit-box" id="timer">000</div>
    </div>

    <div class="tools">
      <button class="toggle-btn active" id="modeDig" onclick="setMode('dig')">⛏️ Dig Mode</button>
      <button class="toggle-btn" id="modeFlag" onclick="setMode('flag')">🚩 Flag Mode</button>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <p style="margin-top: 10px; font-size: 12px; color: #64748b;">Left click to reveal · Right click to place flag</p>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;

    let board = [];
    let state = 'ready'; // ready, playing, lost, won
    let minesLeft = TOTAL_MINES;
    let timerVal = 0;
    let timerId = null;
    let currentMode = 'dig';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeDig').classList.toggle('active', mode === 'dig');
      document.getElementById('modeFlag').classList.toggle('active', mode === 'flag');
    }

    function initGame() {
      state = 'ready';
      minesLeft = TOTAL_MINES;
      timerVal = 0;
      clearInterval(timerId);
      timerId = null;
      document.getElementById('faceBtn').innerText = '🙂';
      document.getElementById('mineCounter').innerText = String(minesLeft).padStart(3, '0');
      document.getElementById('timer').innerText = '000';

      board = [];
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;
      grid.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cellData = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
          board[r][c] = cellData;

          const el = document.createElement('div');
          el.className = 'cell';
          el.id = `cell-${r}-${c}`;
          el.addEventListener('click', () => handleCellClick(r, c));
          el.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          grid.appendChild(el);
        }
      }
    }

    function placeMines(firstR, firstC) {
      let placed = 0;
      while (placed < TOTAL_MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        // keep 3x3 around first click safe
        if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
        if (!board[r][c].isMine) {
          board[r][c].isMine = true;
          placed++;
        }
      }

      // calculate counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function handleCellClick(r, c) {
      if (state === 'lost' || state === 'won') return;
      if (currentMode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'ready') {
        state = 'playing';
        placeMines(r, c);
        timerId = setInterval(() => {
          timerVal = Math.min(999, timerVal + 1);
          document.getElementById('timer').innerText = String(timerVal).padStart(3, '0');
        }, 1000);
      }

      if (cell.isMine) {
        gameOver(false);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged || cell.isMine) return;

      cell.revealed = true;
      const el = document.getElementById(`cell-${r}-${c}`);
      el.classList.add('revealed');

      if (cell.count > 0) {
        el.innerText = cell.count;
        el.classList.add(`cell-${cell.count}`);
      } else {
        // flood fill
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) reveal(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (state === 'lost' || state === 'won') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      const el = document.getElementById(`cell-${r}-${c}`);
      if (cell.flagged) {
        el.innerText = '🚩';
        minesLeft--;
      } else {
        el.innerText = '';
        minesLeft++;
      }
      document.getElementById('mineCounter').innerText = String(Math.max(-99, minesLeft)).padStart(3, '0');
      checkWin();
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      state = won ? 'won' : 'lost';
      clearInterval(timerId);
      document.getElementById('faceBtn').innerText = won ? '😎' : '😵';

      // reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const el = document.getElementById(`cell-${r}-${c}`);
          if (cell.isMine) {
            el.innerText = '💣';
            if (!won) el.classList.add('mine');
          }
        }
      }
    }

    initGame();
  </script>
</body>
</html>
