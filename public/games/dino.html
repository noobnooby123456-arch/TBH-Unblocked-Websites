<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Rex Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .game-box {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.15);
      background: #0f172a;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .btn {
      background: #f59e0b;
      color: #020617;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>SCORE: <span id="score" style="color: #f59e0b;">0</span></div>
    <div>HI-SCORE: <span id="best" style="color: #38bdf8;">0</span></div>
  </div>

  <div class="game-box" onclick="handleClick()">
    <canvas id="canvas" width="600" height="240"></canvas>

    <div class="overlay" id="startScreen">
      <h2 style="font-size: 26px; color: #f59e0b; font-weight: 900;">DESERT T-REX RUNNER</h2>
      <p style="font-size: 13px; color: #94a3b8; max-width: 320px;">Jump over cacti and duck under pterodactyls in this endless runner!</p>
      <button class="btn" onclick="startGame(event)">RUN NOW</button>
    </div>

    <div class="overlay" id="endScreen" style="display: none;">
      <h2 style="font-size: 26px; color: #f43f5e; font-weight: 900;">CRASHED!</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Distance: <span id="finalScore" style="color: #f59e0b; font-weight: bold;">0</span></p>
      <button class="btn" onclick="startGame(event)">RETRY</button>
    </div>
  </div>

  <div class="hint">Space / Up Arrow to Jump · Down Arrow to Duck</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const GROUND_Y = H - 36;

    let dino = {
      x: 50,
      y: GROUND_Y - 40,
      w: 36,
      h: 40,
      vy: 0,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('unblocked_dino_best') || '0', 10);
    let speed = 6;
    let spawnTimer = 0;
    let isRunning = false;
    let animId = null;

    document.getElementById('best').innerText = best;

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function jump() {
      if (!isRunning) return;
      if (dino.isGrounded && !dino.isDucking) {
        dino.vy = -12.5;
        dino.isGrounded = false;
        beep(540, 0.06);
      }
    }

    function duck(isDuck) {
      if (!isRunning) return;
      dino.isDucking = isDuck;
      if (isDuck) {
        dino.h = 24;
        if (!dino.isGrounded) dino.vy += 4; // fast fall
      } else {
        dino.h = 40;
      }
    }

    function handleClick() {
      if (isRunning) jump();
    }

    function startGame(e) {
      if (e) e.stopPropagation();
      score = 0;
      speed = 6;
      obstacles = [];
      dino.y = GROUND_Y - 40;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      dino.h = 40;
      document.getElementById('score').innerText = '0';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('endScreen').style.display = 'none';
      isRunning = true;
      loop();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (!isRunning) startGame();
        else jump();
        e.preventDefault();
      } else if (e.code === 'ArrowDown') {
        duck(true);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowDown') {
        duck(false);
      }
    });

    function spawnObstacle() {
      const type = Math.random() < 0.25 && score > 200 ? 'bird' : 'cactus';
      if (type === 'cactus') {
        const h = Math.random() < 0.4 ? 44 : 34;
        obstacles.push({
          x: W + 20,
          y: GROUND_Y - h,
          w: 22,
          h: h,
          type: 'cactus'
        });
      } else {
        // Pterodactyl flying at low or medium altitude
        const flyY = Math.random() < 0.5 ? GROUND_Y - 36 : GROUND_Y - 60;
        obstacles.push({
          x: W + 20,
          y: flyY,
          w: 34,
          h: 22,
          type: 'bird'
        });
      }
    }

    function loop() {
      if (!isRunning) return;

      score++;
      document.getElementById('score').innerText = Math.floor(score / 5);
      if (Math.floor(score / 5) > best) {
        best = Math.floor(score / 5);
        localStorage.setItem('unblocked_dino_best', best);
        document.getElementById('best').innerText = best;
      }

      // Physics
      dino.vy += 0.75; // gravity
      dino.y += dino.vy;

      if (dino.y + dino.h >= GROUND_Y) {
        dino.y = GROUND_Y - dino.h;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Speed up slowly
      if (score % 400 === 0 && speed < 14) {
        speed += 0.5;
        beep(780, 0.1);
      }

      // Obstacles
      spawnTimer++;
      if (spawnTimer > (80 - Math.min(40, speed * 2)) + Math.random() * 40) {
        spawnObstacle();
        spawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision Check (AABB with slight padding)
        const pad = 4;
        if (
          dino.x + pad < obs.x + obs.w - pad &&
          dino.x + dino.w - pad > obs.x + pad &&
          dino.y + pad < obs.y + obs.h - pad &&
          dino.y + dino.h - pad > obs.y + pad
        ) {
          gameOver();
          return;
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      beep(150, 0.35, 'sawtooth');
      document.getElementById('finalScore').innerText = Math.floor(score / 5);
      document.getElementById('endScreen').style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Ground Line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(W, GROUND_Y);
      ctx.stroke();

      // Ground texture dashes
      ctx.fillStyle = '#475569';
      for (let i = 0; i < 8; i++) {
        let gx = (i * 90 - (score * speed * 0.1) % 90);
        ctx.fillRect(gx, GROUND_Y + 6, 25, 2);
      }

      // Obstacles
      obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(obs.x + 6, obs.y, 10, obs.h);
          ctx.fillRect(obs.x, obs.y + 8, 6, 12);
          ctx.fillRect(obs.x + 16, obs.y + 12, 6, 10);
        } else {
          // Bird
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(obs.x, obs.y + 6, obs.w, 10);
          ctx.fillRect(obs.x + 8, obs.y, 8, 6);
        }
      });

      // Dino
      ctx.fillStyle = '#f59e0b';
      if (dino.isDucking) {
        ctx.fillRect(dino.x, dino.y, dino.w + 10, dino.h);
        ctx.fillStyle = '#020617';
        ctx.fillRect(dino.x + dino.w - 2, dino.y + 4, 3, 3);
      } else {
        // Body
        ctx.fillRect(dino.x + 6, dino.y, 24, dino.h);
        // Head
        ctx.fillRect(dino.x + 18, dino.y, 18, 16);
        // Eye
        ctx.fillStyle = '#020617';
        ctx.fillRect(dino.x + 28, dino.y + 4, 4, 4);
        ctx.fillStyle = '#f59e0b';
        // Legs
        ctx.fillRect(dino.x + 10, dino.y + dino.h - 6, 4, 6);
        ctx.fillRect(dino.x + 20, dino.y + dino.h - 6, 4, 6);
      }
    }

    draw();
  </script>
</body>
</html>
