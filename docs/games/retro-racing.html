<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Highway Racer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .game-box {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.2);
      background: #020617;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #dc2626; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .touch-nav {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .touch-btn {
      width: 60px;
      height: 44px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      font-size: 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>SPEED: <span id="speed" style="color: #ef4444;">120 MPH</span></div>
    <div>DIST: <span id="score" style="color: #38bdf8;">0 M</span></div>
    <div>BEST: <span id="best" style="color: #fbbf24;">0</span></div>
  </div>

  <div class="game-box">
    <canvas id="canvas" width="360" height="480"></canvas>

    <div class="overlay" id="startScreen">
      <h2 style="font-size: 28px; color: #ef4444; font-weight: 900;">TURBO RACER</h2>
      <p style="font-size: 13px; color: #94a3b8; max-width: 260px;">Weave through oncoming highway traffic without crashing!</p>
      <button class="btn" onclick="startGame()">START RACE</button>
    </div>

    <div class="overlay" id="endScreen" style="display: none;">
      <h2 style="font-size: 26px; color: #f43f5e; font-weight: 900;">CRASHED!</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Distance: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0 M</span></p>
      <button class="btn" onclick="startGame()">TRY AGAIN</button>
    </div>
  </div>

  <div class="touch-nav">
    <button class="touch-btn" onpointerdown="moveLeft()">◀</button>
    <button class="touch-btn" onpointerdown="moveRight()">▶</button>
  </div>

  <div class="hint">Left/Right or A/D to switch lanes · Up/Down for throttle</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const LANES = [80, 150, 220, 290];
    let playerLane = 1;
    let player = { x: LANES[1], y: H - 85, w: 32, h: 58 };
    let enemies = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('unblocked_racing_best') || '0', 10);
    let speed = 7;
    let roadOffset = 0;
    let isRunning = false;
    let keys = {};

    document.getElementById('best').innerText = best;

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08, type = 'sawtooth') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function moveLeft() {
      if (!isRunning) return;
      if (playerLane > 0) {
        playerLane--;
        beep(350, 0.05);
      }
    }
    function moveRight() {
      if (!isRunning) return;
      if (playerLane < LANES.length - 1) {
        playerLane++;
        beep(350, 0.05);
      }
    }

    function startGame() {
      score = 0;
      speed = 7;
      playerLane = 1;
      enemies = [];
      document.getElementById('score').innerText = '0 M';
      document.getElementById('speed').innerText = '120 MPH';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('endScreen').style.display = 'none';
      isRunning = true;
      loop();
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
      if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function spawnEnemy() {
      const lane = Math.floor(Math.random() * LANES.length);
      const enemyColors = ['#eab308', '#06b6d4', '#10b981', '#a855f7'];
      enemies.push({
        lane: lane,
        x: LANES[lane],
        y: -70,
        w: 32,
        h: 58,
        speed: speed * (0.45 + Math.random() * 0.25),
        color: enemyColors[Math.floor(Math.random() * enemyColors.length)]
      });
    }

    let spawnTimer = 0;
    function loop() {
      if (!isRunning) return;

      // Throttle
      if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(13, speed + 0.05);
      else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(5, speed - 0.05);

      score += Math.floor(speed * 0.4);
      document.getElementById('score').innerText = score + ' M';
      document.getElementById('speed').innerText = Math.floor(speed * 18) + ' MPH';

      if (score > best) {
        best = score;
        localStorage.setItem('unblocked_racing_best', best);
        document.getElementById('best').innerText = best;
      }

      // Smooth lane slide
      player.x += (LANES[playerLane] - player.x) * 0.25;

      roadOffset = (roadOffset + speed) % 60;

      // Spawning
      spawnTimer += speed;
      if (spawnTimer > 320) {
        spawnEnemy();
        spawnTimer = 0;
      }

      // Move enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += (speed - en.speed) + 2.5;

        // Collision Check
        if (
          Math.abs(player.x - en.x) < 26 &&
          player.y < en.y + en.h - 6 &&
          player.y + player.h > en.y + 6
        ) {
          gameOver();
          return;
        }

        if (en.y > H + 80) {
          enemies.splice(i, 1);
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      beep(120, 0.4, 'sawtooth');
      document.getElementById('finalScore').innerText = score + ' M';
      document.getElementById('endScreen').style.display = 'flex';
    }

    function drawCar(x, y, color, isPlayer = false) {
      ctx.save();
      ctx.translate(x, y);

      // Body
      ctx.fillStyle = color;
      ctx.fillRect(-14, -28, 28, 56);

      // Windshield
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-11, -12, 22, 14);

      // Rear window
      ctx.fillRect(-11, 14, 22, 8);

      // Headlights / Taillights
      if (isPlayer) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-12, -28, 6, 4);
        ctx.fillRect(6, -28, 6, 4);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-12, 26, 6, 3);
        ctx.fillRect(6, 26, 6, 3);
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-12, -28, 6, 4);
        ctx.fillRect(6, -28, 6, 4);
      }

      // Wheels
      ctx.fillStyle = '#020617';
      ctx.fillRect(-16, -20, 3, 10);
      ctx.fillRect(13, -20, 3, 10);
      ctx.fillRect(-16, 12, 3, 10);
      ctx.fillRect(13, 12, 3, 10);

      ctx.restore();
    }

    function draw() {
      // Road
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(40, 0, W - 80, H);

      // Grass / Shoulders
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, 0, 40, H);
      ctx.fillRect(W - 40, 0, 40, H);

      // Shoulder stripe
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(36, 0, 4, H);
      ctx.fillRect(W - 40, 0, 4, H);

      // Lane dividers
      ctx.fillStyle = '#f8fafc';
      for (let laneIdx = 1; laneIdx < LANES.length; laneIdx++) {
        const divX = (LANES[laneIdx - 1] + LANES[laneIdx]) / 2;
        for (let y = -60 + roadOffset; y < H; y += 60) {
          ctx.fillRect(divX - 2, y, 4, 30);
        }
      }

      // Draw enemies
      enemies.forEach(en => {
        drawCar(en.x, en.y, en.color, false);
      });

      // Draw Player
      drawCar(player.x, player.y, '#ef4444', true);
    }

    draw();
  </script>
</body>
</html>
