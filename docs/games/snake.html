<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 1px;
    }
    .hud span { color: #10b981; }
    .hud .high { color: #f59e0b; }
    .canvas-container {
      position: relative;
      border: 3px solid #1e293b;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
      border-radius: 8px;
      background: #020617;
    }
    canvas {
      display: block;
      background: #020617;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      border-radius: 6px;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 { font-size: 26px; color: #10b981; text-transform: uppercase; letter-spacing: 2px; }
    .overlay p { font-size: 13px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
    .btn {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn:hover { background: #34d399; transform: scale(1.05); }
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-gap: 8px;
      margin-top: 14px;
    }
    .touch-btn {
      width: 48px;
      height: 48px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { background: #10b981; color: #020617; }
  </style>
</head>
<body>

  <div class="hud">
    <div>SCORE: <span id="scoreVal">0</span></div>
    <div>BEST: <span id="highVal" class="high">0</span></div>
    <div>SPEED: <span id="speedVal">1x</span></div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h2>Retro Snake</h2>
      <p>Eat neon apples to grow. Avoid running into walls and your own tail!</p>
      <button class="btn" onclick="startGame()">PRESS TO PLAY</button>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 style="color: #ef4444;">GAME OVER</h2>
      <p>Final Score: <span id="finalScore" style="color: #fff; font-weight: bold;">0</span></p>
      <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onclick="setDir(0, -1)">▲</button>
    <div></div>
    <button class="touch-btn" onclick="setDir(-1, 0)">◀</button>
    <button class="touch-btn" onclick="setDir(0, 1)">▼</button>
    <button class="touch-btn" onclick="setDir(1, 0)">▶</button>
  </div>

  <div class="controls-hint">Controls: Arrow Keys or WASD · Space to Pause</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    const tileCount = canvas.width / grid;

    let snake = [];
    let food = { x: 10, y: 10, type: 'normal' };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('unblocked_snake_high') || '0', 10);
    let gameLoop = null;
    let isPaused = false;
    let isRunning = false;
    let speed = 110;

    document.getElementById('highVal').innerText = highScore;

    // Web Audio Synthesizer for beep sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function spawnFood() {
      let valid = false;
      while(!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.type = Math.random() < 0.15 ? 'golden' : 'normal';
    }

    function startGame() {
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('gameOverOverlay').style.display = 'none';
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      speed = 110;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('speedVal').innerText = '1x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
      playBeep(440, 0.1);
    }

    function setDir(nx, ny) {
      if (!isRunning || isPaused) return;
      if (nx !== 0 && dx === 0) { nextDx = nx; nextDy = 0; }
      if (ny !== 0 && dy === 0) { nextDx = 0; nextDy = ny; }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') { setDir(0, -1); e.preventDefault(); }
      else if (e.code === 'ArrowDown' || e.key === 's' || e.key === 'S') { setDir(0, 1); e.preventDefault(); }
      else if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { setDir(-1, 0); e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') { setDir(1, 0); e.preventDefault(); }
      else if (e.code === 'Space') {
        if (!isRunning) startGame();
        else isPaused = !isPaused;
        e.preventDefault();
      }
    });

    function update() {
      if (isPaused || !isRunning) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        const points = food.type === 'golden' ? 30 : 10;
        score += points;
        document.getElementById('scoreVal').innerText = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('unblocked_snake_high', highScore);
          document.getElementById('highVal').innerText = highScore;
        }

        playBeep(food.type === 'golden' ? 880 : 587, 0.12, 'square');

        // Increase speed slightly
        if (score % 50 === 0 && speed > 50) {
          speed -= 5;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
          document.getElementById('speedVal').innerText = (110 / speed).toFixed(1) + 'x';
        }

        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(160, 0.35, 'sawtooth');
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverOverlay').style.display = 'flex';
    }

    function draw() {
      // Background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#091329';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += grid) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      if (food.type === 'golden') {
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 10;
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((segment, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(segment.x * grid + 1, segment.y * grid + 1, grid - 2, grid - 2);
      });
      ctx.shadowBlur = 0;
    }

    draw();
  </script>
</body>
</html>
