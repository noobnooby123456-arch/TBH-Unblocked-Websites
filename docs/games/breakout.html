<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060913;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .hud span { color: #38bdf8; }
    .game-box {
      position: relative;
      border: 3px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
      background: #020617;
    }
    canvas {
      display: block;
      cursor: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">❤️❤️❤️</span></div>
    <div>BEST: <span id="best" style="color: #fbbf24;">0</span></div>
  </div>

  <div class="game-box">
    <canvas id="canvas" width="480" height="420"></canvas>

    <div class="overlay" id="startScreen">
      <h2 style="font-size: 28px; color: #38bdf8; font-weight: 900;">BRICK BREAKER</h2>
      <p style="font-size: 13px; color: #94a3b8; max-width: 320px;">Move your paddle to bounce the ball and smash all the neon power bricks!</p>
      <button class="btn" onclick="startGame()">START GAME</button>
    </div>

    <div class="overlay" id="endScreen" style="display: none;">
      <h2 id="endTitle" style="font-size: 26px; color: #f43f5e; font-weight: 900;">GAME OVER</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Final Score: <span id="finalScore" style="font-weight: bold; color: #38bdf8;">0</span></p>
      <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Move Mouse or Arrow Keys / A & D to steer paddle</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const PADDLE_W = 85;
    const PADDLE_H = 12;
    const BALL_R = 6;

    let paddleX = (W - PADDLE_W) / 2;
    let ballX = W / 2;
    let ballY = H - 60;
    let ballDx = 3.5;
    let ballDy = -3.5;
    let score = 0;
    let lives = 3;
    let best = parseInt(localStorage.getItem('unblocked_breakout_best') || '0', 10);
    let isRunning = false;
    let rightPressed = false;
    let leftPressed = false;

    document.getElementById('best').innerText = best;

    // Bricks
    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 56;
    const brickHeight = 18;
    const brickPadding = 9;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 18;
    const colors = ['#ef4444', '#f97316', '#eab308', '#10b981', '#38bdf8'];

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function startGame() {
      score = 0;
      lives = 3;
      paddleX = (W - PADDLE_W) / 2;
      ballX = W / 2;
      ballY = H - 60;
      ballDx = 3.5;
      ballDy = -3.5;
      document.getElementById('score').innerText = '0';
      document.getElementById('lives').innerText = '❤️❤️❤️';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('endScreen').style.display = 'none';
      initBricks();
      isRunning = true;
    }

    // Controls
    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < W) {
        paddleX = relativeX - PADDLE_W / 2;
      }
    });

    window.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.touches[0].clientX - rect.left;
      if (relativeX > 0 && relativeX < W) {
        paddleX = relativeX - PADDLE_W / 2;
      }
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = true;
    });
    window.addEventListener('keyup', e => {
      if (['ArrowRight', 'KeyD'].includes(e.code)) rightPressed = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) leftPressed = false;
    });

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ballX > b.x &&
              ballX < b.x + brickWidth &&
              ballY > b.y &&
              ballY < b.y + brickHeight
            ) {
              ballDy = -ballDy;
              b.status = 0;
              score += (brickRowCount - r) * 10;
              document.getElementById('score').innerText = score;
              if (score > best) {
                best = score;
                localStorage.setItem('unblocked_breakout_best', best);
                document.getElementById('best').innerText = best;
              }
              beep(500 + r * 60);
            }
          }
        }
      }

      if (activeBricks === 0) {
        // You Win!
        isRunning = false;
        document.getElementById('endTitle').innerText = 'YOU WIN!';
        document.getElementById('endTitle').style.color = '#10b981';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('endScreen').style.display = 'flex';
      }
    }

    function update() {
      if (!isRunning) return;

      if (rightPressed && paddleX < W - PADDLE_W) paddleX += 6;
      else if (leftPressed && paddleX > 0) paddleX -= 6;

      paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

      // Wall collision
      if (ballX + ballDx > W - BALL_R || ballX + ballDx < BALL_R) {
        ballDx = -ballDx;
        beep(320);
      }
      if (ballY + ballDy < BALL_R) {
        ballDy = -ballDy;
        beep(320);
      } else if (ballY + ballDy > H - BALL_R - 20) {
        // Paddle collision
        if (ballX > paddleX && ballX < paddleX + PADDLE_W) {
          ballDy = -Math.abs(ballDy);
          const hitSpot = (ballX - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
          ballDx = hitSpot * 5;
          beep(620);
        } else if (ballY + ballDy > H) {
          // Missed
          lives--;
          document.getElementById('lives').innerText = '❤️'.repeat(Math.max(0, lives));
          beep(180, 0.25);
          if (lives <= 0) {
            isRunning = false;
            document.getElementById('endTitle').innerText = 'GAME OVER';
            document.getElementById('endTitle').style.color = '#f43f5e';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('endScreen').style.display = 'flex';
          } else {
            ballX = W / 2;
            ballY = H - 60;
            ballDx = 3.5;
            ballDy = -3.5;
            paddleX = (W - PADDLE_W) / 2;
          }
        }
      }

      ballX += ballDx;
      ballY += ballDy;

      collisionDetection();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, W, H);

      // Draw Bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }

      // Draw Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fillRect(paddleX, H - 24, PADDLE_W, PADDLE_H);

      // Draw Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initBricks();
    loop();
  </script>
</body>
</html>
